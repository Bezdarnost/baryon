name: Release

# Builds wheels for every supported platform and Python version, tests each wheel on its own
# platform, and publishes to PyPI when a version tag (v1.2.3) is pushed. Run it manually to
# build and test without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with Cargo.toml
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"; exit 1; }

  wheels:
    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, test: false }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, test: true, pythons: "3.10\n3.11\n3.12\n3.13\n3.14\n3.14t" }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, test: true, pythons: "3.10\n3.11\n3.12\n3.13\n3.14\n3.14t" }
          - { name: windows-x64, runner: windows-latest, target: x64, test: true, pythons: "3.10\n3.11\n3.12\n3.13\n3.14\n3.14t" }
          # Python publishes Windows ARM64 builds from 3.11 on.
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64, test: true, pythons: "3.11\n3.12\n3.13\n3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ !matrix.manylinux }}
        with:
          python-version: ${{ matrix.pythons }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --find-interpreter
          sccache: false
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
        if: matrix.test
      - name: Test the built wheel
        if: matrix.test
        shell: bash
        run: |
          uv venv --python 3.12 .test-venv
          uv pip install --python .test-venv numpy pytest pillow
          uv pip install --python .test-venv --no-index --find-links dist baryon
          if [ -d .test-venv/Scripts ]; then py=.test-venv/Scripts/python; else py=.test-venv/bin/python; fi
          "$py" -m pytest tests/python -q -p no:cacheprovider

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build a wheel from the sdist
        run: |
          pip install dist/*.tar.gz
          python -c "import baryon; print(baryon.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check-version, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/baryon
    permissions:
      id-token: write # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
