[workspace]
resolver = "3"
members = ["crates/baryon-core", "crates/baryon-image", "crates/baryon-libjxl", "crates/baryon-python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bezdarnost/baryon"
authors = ["Aman Urumbekov <amanurumbekov@gmail.com>"]

[workspace.dependencies]
baryon-core = { path = "crates/baryon-core", version = "0.1.0" }
baryon-image = { path = "crates/baryon-image", version = "0.1.0" }
baryon-libjxl = { path = "crates/baryon-libjxl", version = "0.1.0" }
bytemuck = "1.23"
fast_image_resize = { version = "6.1", features = ["rayon"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }
jxl = "0.8"
jxl-oxide = { version = "0.12", default-features = false, features = ["moxcms", "rayon"] }
numpy = "0.30"
png = "0.18"
pyo3 = "0.30"
rayon = "1.10"
thiserror = "2.0"
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
