[package]
name = "baryon-image"
description = "Lazy, region-aware image decoding and processing for baryon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = ["jxl-encode"]
# JPEG XL encoding through the vendored libjxl; needs CMake and a C++17 compiler to build.
jxl-encode = ["dep:baryon-libjxl"]

[dependencies]
baryon-core.workspace = true
baryon-libjxl = { workspace = true, optional = true }
bytemuck.workspace = true
fast_image_resize.workspace = true
jpeg-encoder.workspace = true
jxl.workspace = true
jxl-oxide.workspace = true
png.workspace = true
rayon.workspace = true
zune-core.workspace = true
zune-jpeg.workspace = true

[lints]
workspace = true
