site_name: baryon
site_description: Fast, lazy, region-aware image decoding for Python, written in Rust
site_url: https://bezdarnost.github.io/baryon/
repo_url: https://github.com/Bezdarnost/baryon
repo_name: Bezdarnost/baryon
edit_uri: edit/main/docs/
copyright: MIT OR Apache-2.0

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Lazy pipelines: guide/lazy-pipelines.md
      - Using all cores: guide/parallelism.md
      - JPEG XL: guide/jpeg-xl.md
  - Formats: formats.md
  - Benchmarks: benchmarks.md
  - API reference: api.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            allow_inspection: false
            docstring_style: google
            docstring_section_style: list
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
